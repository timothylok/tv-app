name = "ai-tv-scheduler"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false      # no public URL: this Worker only runs on its cron triggers
preview_urls = false

[vars]
REPO = "timothylok/tv-app"
WORKFLOW = "ai-news.yml"
HOUSEKEEPING_WORKFLOW = "housekeeping.yml"
HOUSEKEEPING_CRON = "30 11 * * *"   # must equal the second cron below
BRANCH = "main"

# UTC. Episodes at 19:00 and 01:00 = 8am and 2pm New Zealand summer time (the 8pm run was dropped: viewing twice a day).
# Housekeeping at 11:30 = 00:30 NZ summer time, between the 2pm and 8am episodes.
[triggers]
crons = ["0 19,1 * * *", "30 11 * * *"]
