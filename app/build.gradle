plugins { id 'com.android.application' }
android {
    namespace 'com.superghosttim.aichannels'
    compileSdk 36
    defaultConfig {
        applicationId 'com.superghosttim.aichannels'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
        // Public, read-only list of channels (static JSON in the R2 bucket). No secrets live in the app.
        buildConfigField 'String', 'CHANNELS_URL', '"https://pub-31476484de9245329a3f35502c44e692.r2.dev/channels.json"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'   // org.json is only a stub in plain JVM tests
}
