name: housekeeping
on:
  workflow_dispatch:
  # Started once a day by the Cloudflare Worker in worker/ (second cron).
concurrency:
  group: ai-news-publish   # same group as ai-news: never tidy the bucket while an episode is being published
  cancel-in-progress: false
jobs:
  tidy:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04; test that deliberately
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/housekeeping.py
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
